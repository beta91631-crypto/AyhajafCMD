[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ayhajafcmd-v2"
version = "0.1.0"
description = "A persistent-profile Chromium browser rendered in the terminal"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "Pillow>=10",
    "playwright>=1.48",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
socialcmd-v2 = "socialcmd_v2.main:main"

[tool.setuptools.packages.find]
where = ["src"]
