[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "socialcmd"
version = "0.1.0a0"
description = "Browse social media websites in a terminal"
requires-python = ">=3.10"
dependencies = ["Pillow>=10,<13", "websockets>=13,<16"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
socialcmd = "socialcmd.visual_browser:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]