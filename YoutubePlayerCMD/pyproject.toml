[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "youtubecmd"
version = "0.1.0a0"
description = "A terminal-based YouTube video player for Windows"
requires-python = ">=3.10"
dependencies = ["yt-dlp>=2024.1.0", "Pillow>=10,<13", "websockets>=13,<16"]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]